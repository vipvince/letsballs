# Keep the Streamlit Community Cloud app warm.
# Set repository secret STREAMLIT_APP_URL to the app URL, e.g.:
#   https://playplaytennis.streamlit.app/
#   or https://www.playplaytennis.com
#
# Complements UptimeRobot and the Cloud Agent twice-daily Gmail monitor ping.
# Uses a headless browser because auth-gated Streamlit apps redirect curl in a loop.

name: Keep Streamlit awake

on:
  schedule:
    # Every 15 minutes (UTC). Streamlit free apps sleep after ~15m idle.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}

    steps:
      - name: Check configuration
        run: |
          if [ -z "${STREAMLIT_APP_URL}" ]; then
            echo "Missing repository secret STREAMLIT_APP_URL."
            echo "Set it to your deployed app URL, for example https://playplaytennis.streamlit.app/"
            exit 1
          fi
          echo "Configured STREAMLIT_APP_URL host: $(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          u = os.environ["STREAMLIT_APP_URL"]
          if not u.startswith("http"):
              u = "https://" + u
          print(urlparse(u).netloc)
          PY
          )"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.49.1
          npx playwright install chromium --with-deps

      - name: Wake / ping Streamlit app in browser
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            let url = process.env.STREAMLIT_APP_URL.trim();
            if (!/^https?:\/\//i.test(url)) url = `https://${url}`;

            const browser = await chromium.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });
            try {
              const page = await browser.newPage();
              console.log('Navigating to', url);
              const resp = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 120000,
              }).catch((e) => {
                console.log('goto warning:', e.message);
                return null;
              });
              if (resp) console.log('HTTP', resp.status(), 'final URL', page.url());

              const wakeSelectors = [
                'button:has-text("Yes, get this app back up")',
                'button:has-text("get this app back up")',
                'button:has-text("Wake up")',
                '[data-testid="stBaseButton-primary"]',
              ];
              for (const sel of wakeSelectors) {
                const btn = page.locator(sel).first();
                if (await btn.count()) {
                  console.log('Clicking wake button:', sel);
                  await btn.click({ timeout: 10000 }).catch((e) =>
                    console.log('wake click:', e.message)
                  );
                  break;
                }
              }

              // Touch the app shell if present (public apps).
              await page
                .waitForSelector(
                  'section[data-testid="stApp"], div[data-testid="stAppViewContainer"]',
                  { timeout: 45000 }
                )
                .then(() => console.log('App container present'))
                .catch(() =>
                  console.log(
                    'No stApp container (auth wall or sleep page is OK for keep-alive traffic)'
                  )
                );

              await page.waitForTimeout(5000);
              console.log('Keep-awake visit complete');
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
